services:
  app:
    image: ghcr.io/martinontiveros/miapp:${APP_TAG:-latest} 
    container_name: miapp
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    container_name: miapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: miapp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: miapp
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miapp -d miapp"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:

volumes:
  dbdata:
